<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Assistant PoC Console</title>
  <style>
    :root { --bg:#f6f8fb; --card:#fff; --line:#d9e1ef; --primary:#1d4ed8; --text:#0f172a; }
    body { font-family: Inter, Arial, sans-serif; margin:0; background:var(--bg); color:var(--text); }
    .wrap { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
    .top { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
    .tabs { display:flex; gap:8px; margin-top:10px; }
    .tab { border:1px solid var(--line); background:#eef2ff; padding:8px 14px; border-radius:8px; cursor:pointer; }
    .tab.active { background:var(--primary); color:#fff; }
    .panel { display:none; margin-top:16px; }
    .panel.active { display:block; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
    label { font-size:13px; color:#334155; margin-top:8px; display:block; }
    input, textarea, select { width:100%; box-sizing:border-box; margin-top:6px; padding:8px; border:1px solid #cbd5e1; border-radius:8px; }
    button { margin-top:10px; border:0; background:var(--primary); color:white; padding:8px 12px; border-radius:8px; cursor:pointer; }
    pre { background:#0b1020; color:#c8dcff; padding:10px; border-radius:8px; overflow:auto; min-height:60px; }
    table { width:100%; border-collapse: collapse; font-size:13px; }
    th, td { border:1px solid #dbe2ef; padding:8px; text-align:left; }
    th { background:#f1f5f9; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>LLM Assistant PoC Console</h1>
      <div>사용자/관리자 기능을 한 화면에서 시험할 수 있는 통합 UI</div>
      <div class="tabs">
        <button class="tab active" onclick="showTab('user')">사용자 화면</button>
        <button class="tab" onclick="showTab('admin')">관리자 화면</button>
      </div>
    </div>

    <section id="user" class="panel active">
      <div class="grid">
        <div class="card">
          <h3>QA 질의</h3>
          <label>질문</label>
          <textarea id="qaQuestion" rows="3">인증서 갱신 절차 알려줘</textarea>
          <label>모드</label>
          <select id="qaMode"><option value="rag">rag</option><option value="llm_only">llm_only</option></select>
          <label>사용자 ID</label>
          <input id="qaUser" value="u001" />
          <button onclick="runQA()">QA 실행</button>
          <pre id="qaResult">결과 대기중...</pre>
        </div>

        <div class="card">
          <h3>MariaDB 자연어 조회</h3>
          <label>질문</label>
          <textarea id="dbQuestion" rows="3">최근 7일 CRL 오류 이력 보여줘</textarea>
          <label>사용자 ID</label>
          <input id="dbUser" value="u001" />
          <button onclick="runDB()">조회 실행</button>
          <pre id="dbResult">결과 대기중...</pre>
        </div>

        <div class="card">
          <h3>최근 질의 이력</h3>
          <label>사용자 ID</label>
          <input id="historyUser" value="u001" />
          <button onclick="loadHistory()">이력 조회</button>
          <pre id="historyResult">결과 대기중...</pre>
        </div>

        <div class="card">
          <h3>성능 요약</h3>
          <label>Mode</label>
          <select id="metricsMode"><option value="all">all</option><option value="rag">rag</option><option value="llm_only">llm_only</option><option value="db_nl">db_nl</option></select>
          <button onclick="loadMetrics()">메트릭 조회</button>
          <pre id="metricsResult">결과 대기중...</pre>
        </div>
      </div>
    </section>

    <section id="admin" class="panel">
      <div class="grid">
        <div class="card">
          <h3>문서 업로드</h3>
          <input id="docFile" type="file" />
          <button onclick="uploadDoc()">업로드</button>
          <pre id="uploadResult">결과 대기중...</pre>
        </div>

        <div class="card">
          <h3>문서 목록</h3>
          <button onclick="loadDocs()">목록 새로고침</button>
          <div id="docsTable"></div>
        </div>

        <div class="card">
          <h3>학습 내용 검수/수정</h3>
          <label>Source</label>
          <input id="reviewSource" value="manual_v1.pdf#p2" />
          <label>원문</label>
          <textarea id="reviewOriginal" rows="2">CRL 검증 실패 시 재시도한다.</textarea>
          <label>수정문</label>
          <textarea id="reviewRevised" rows="2">CRL 검증 실패 시 네트워크 점검 후 3회 재시도하고 관리자에게 알림을 전송한다.</textarea>
          <label>검수자</label>
          <input id="reviewer" value="admin01" />
          <button onclick="submitReview()">검수 반영</button>
          <pre id="reviewResult">결과 대기중...</pre>
        </div>

        <div class="card">
          <h3>검수 이력 / 재학습</h3>
          <button onclick="loadReviews()">검수 이력 조회</button>
          <button onclick="triggerReindex()">재인덱싱 실행</button>
          <pre id="reviewListResult">결과 대기중...</pre>
        </div>
      </div>
    </section>
  </div>

<script>
function showTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  const idx = name === 'user' ? 0 : 1;
  document.querySelectorAll('.tab')[idx].classList.add('active');
}

async function runQA() {
  const payload = {
    question: document.getElementById('qaQuestion').value,
    mode: document.getElementById('qaMode').value,
    user_id: document.getElementById('qaUser').value
  };
  const res = await fetch('/api/v1/qa/query', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  document.getElementById('qaResult').textContent = JSON.stringify(await res.json(), null, 2);
}

async function runDB() {
  const payload = { question: document.getElementById('dbQuestion').value, user_id: document.getElementById('dbUser').value };
  const res = await fetch('/api/v1/db/nl-query', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  document.getElementById('dbResult').textContent = JSON.stringify(await res.json(), null, 2);
}

async function loadHistory() {
  const user = document.getElementById('historyUser').value;
  const res = await fetch(`/api/v1/history/recent?user_id=${encodeURIComponent(user)}&limit=20`);
  document.getElementById('historyResult').textContent = JSON.stringify(await res.json(), null, 2);
}

async function loadMetrics() {
  const mode = document.getElementById('metricsMode').value;
  const res = await fetch(`/api/v1/metrics/summary?mode=${mode}&period=24h&device=all`);
  document.getElementById('metricsResult').textContent = JSON.stringify(await res.json(), null, 2);
}

async function uploadDoc() {
  const fileInput = document.getElementById('docFile');
  if (!fileInput.files.length) return alert('파일을 선택하세요.');
  const form = new FormData();
  form.append('file', fileInput.files[0]);
  const res = await fetch('/api/v1/admin/documents/upload', { method:'POST', body: form });
  document.getElementById('uploadResult').textContent = JSON.stringify(await res.json(), null, 2);
  await loadDocs();
}

async function loadDocs() {
  const res = await fetch('/api/v1/admin/documents');
  const data = await res.json();
  if (!data.length) { document.getElementById('docsTable').innerHTML = '<i>업로드된 문서 없음</i>'; return; }
  const rows = data.map(d => `<tr><td>${d.document_id}</td><td>${d.filename}</td><td>${d.size}</td><td>${d.uploaded_at}</td></tr>`).join('');
  document.getElementById('docsTable').innerHTML = `<table><thead><tr><th>ID</th><th>파일명</th><th>크기</th><th>업로드시각</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function submitReview() {
  const payload = {
    source: document.getElementById('reviewSource').value,
    original_text: document.getElementById('reviewOriginal').value,
    revised_text: document.getElementById('reviewRevised').value,
    reviewer: document.getElementById('reviewer').value,
  };
  const res = await fetch('/api/v1/admin/knowledge/review', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  document.getElementById('reviewResult').textContent = JSON.stringify(await res.json(), null, 2);
  await loadReviews();
}

async function loadReviews() {
  const res = await fetch('/api/v1/admin/knowledge/reviews');
  document.getElementById('reviewListResult').textContent = JSON.stringify(await res.json(), null, 2);
}

async function triggerReindex() {
  const res = await fetch('/api/v1/admin/reindex', { method:'POST' });
  const data = await res.json();
  const area = document.getElementById('reviewListResult');
  area.textContent = `[REINDEX]\n` + JSON.stringify(data, null, 2) + `\n\n` + area.textContent;
}
</script>
</body>
</html>
